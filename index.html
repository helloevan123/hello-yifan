<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>产品参数汇总</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: header → tabs (Sheet | Collections). Sheet: upload, files to save, product sheet, saved files. Collections: list + detail */
/* Single light look on white, by request: same in every theme */
:root{
  --bg:#ffffff;--panel:#f5f7f6;--panel2:#edf2f0;--ink:#15201e;--ink2:#3b4b48;--mute:#6a7a77;--line:#e2e8e6;--line2:#cdd7d4;
  --acc:#0b6e69;--acc-ink:#ffffff;--acc-soft:#e3f0ee;
  --dup:#9a4d06;--dup-soft:#fdf0db;--pend:#375a88;--pend-soft:#e9eff8;--danger:#b4321f;
  --f-ui:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:17px;--fs-xl:24px;
  color-scheme:light;
}
*,*:before,*:after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:var(--fs-md)/1.6 var(--f-ui);-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 72px;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
h1{font-size:var(--fs-xl);line-height:1.25;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:var(--fs-lg);line-height:1.35;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:var(--fs-md);font-weight:600;margin:0}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:4px}
.top>div{min-width:0}
.sub{color:var(--mute);margin-top:6px;max-width:64ch;font-size:var(--fs-sm)}
.topr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;padding:4px 5px 4px 12px;border:1px solid var(--line);border-radius:999px;font-size:var(--fs-sm)}
.who b{font-weight:600}
.role{font-size:var(--fs-xs);padding:1px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.role.ro{background:var(--pend-soft);color:var(--pend)}
section{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.notice{background:var(--pend-soft);border-color:transparent;font-size:var(--fs-md);color:var(--ink2)}
.notice.warn{background:var(--dup-soft)}
.lbl{font-size:var(--fs-xs);font-weight:500;color:var(--mute);letter-spacing:.02em}
.hint{font-size:var(--fs-sm);color:var(--mute)}
.muted{color:var(--mute)}
.code{font-family:var(--f-code);font-weight:600;letter-spacing:.01em}
.num,.tnum{font-variant-numeric:tabular-nums}
.num{text-align:right}

/* controls */
button{font:inherit;font-size:var(--fs-sm);font-weight:500;cursor:pointer;border-radius:7px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);padding:7px 14px;white-space:nowrap;line-height:1.4}
button.ghost{background:transparent;color:var(--acc)}
button.quiet{border-color:var(--line2);background:var(--bg);color:var(--ink2)}
button.danger{border-color:var(--danger);background:var(--danger);color:#fff}
button.link{border:0;background:none;color:var(--acc);padding:0;text-decoration:underline;text-underline-offset:2px}
button.mini{padding:2px 9px;font-size:var(--fs-xs)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select,input[type=number],input[type=search],input[type=text],input[type=password]{font:inherit;font-size:var(--fs-sm);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;min-width:0;max-width:100%}
select:hover,input:hover{border-color:var(--mute)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);margin:0;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;background:var(--panel)}
.seg button{border:0;border-radius:6px;background:transparent;color:var(--ink2);padding:4px 12px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(21,32,30,.12)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-sm);color:var(--ink2);cursor:pointer;user-select:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.prog{font-size:var(--fs-sm);color:var(--acc)}
.prog.err{color:var(--danger)}
.badge{display:inline-block;font-size:11px;font-weight:500;line-height:1.7;padding:0 7px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap;font-family:var(--f-ui);letter-spacing:0}
.b-dup{background:var(--dup-soft);color:var(--dup)}
.b-pend{background:var(--pend-soft);color:var(--pend)}
.b-hid{background:var(--panel2);color:var(--ink2)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mute);padding:10px 14px;font-size:var(--fs-md);font-weight:500;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tcount{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--panel2);color:var(--ink2);font-size:var(--fs-xs);line-height:1.7;text-align:center}
.tcount:empty{display:none}

/* sign-in */
.login{max-width:440px;width:100%;margin:8px auto 0;padding:26px}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:10px;text-align:left;white-space:normal}
.door b{font-size:var(--fs-lg);font-weight:600}
.door span{font-size:var(--fs-xs);color:var(--mute);font-weight:400}
.door[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.login form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.login input{width:100%;padding:9px 11px;font-size:var(--fs-md)}
.login button[type=submit]{padding:10px 14px;font-size:var(--fs-md)}
.ltabs{display:flex;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;background:var(--panel)}
.ltabs button{flex:1;border:0;border-radius:6px;background:transparent;color:var(--ink2)}
.ltabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(21,32,30,.12)}
.login .hint{margin-top:16px}

/* upload + staged files */
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:20px 16px;text-align:center;color:var(--ink2);cursor:pointer;background:var(--panel)}
.drop.on,.drop:hover{border-color:var(--acc);background:var(--acc-soft)}
#upHint{margin-top:10px}
.fh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fh h2{min-width:0;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px 16px}
.map select,.map input{width:100%}
.smp{font-size:var(--fs-xs);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.stl{list-style:none;margin:16px 0 0;padding:12px 14px;background:var(--panel);border-radius:8px;display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm);color:var(--ink2)}
.stl li{display:flex;gap:8px}
.stl li:before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--line2);margin-top:8px}
.stl li.w{color:var(--dup)}
.stl li.w:before{background:var(--dup)}
.prog{margin-top:8px}

/* sheet toolbar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
.chip{font-size:var(--fs-xs);padding:2px 10px;border-radius:999px;background:var(--panel2);color:var(--ink2);font-variant-numeric:tabular-nums}
.chip.dup{background:var(--dup-soft);color:var(--dup)}
.chip.pend{background:var(--pend-soft);color:var(--pend)}
.tips{font-size:var(--fs-sm);color:var(--mute);margin:0 0 12px}
.tips.on{color:var(--acc)}
details.lay{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-top:14px;background:var(--panel)}
details.lay>summary{cursor:pointer;padding:10px 0;font-size:var(--fs-md);font-weight:600}
.layin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:24px;padding-bottom:14px}
@media (max-width:680px){.layin{grid-template-columns:1fr}.entry{grid-template-columns:1fr}}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--bg);border:1px solid var(--line);margin-bottom:4px}
.lrow.off .lname{color:var(--mute)}
.lrow.over-t{box-shadow:inset 0 3px 0 var(--acc)}
.lrow.over-b{box-shadow:inset 0 -3px 0 var(--acc)}
.grip{cursor:grab;color:var(--mute);font-size:15px;line-height:1;padding:0 2px;user-select:none}
.lname{flex:1;font-size:var(--fs-sm);cursor:pointer}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--acc-soft);border-radius:10px;margin-top:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.selbar>span{margin-right:auto;font-weight:600;color:var(--acc);font-size:var(--fs-sm)}
.addform{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding-top:10px;border-top:1px solid rgba(11,110,105,.18);margin-top:2px}
.addform .field{width:200px;max-width:100%}
.addform .prog{flex-basis:100%;margin:0}
.hidbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--mute);margin:0 0 10px}

/* table */
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
#tview table{min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:var(--fs-xs);font-weight:500;color:var(--mute);letter-spacing:.02em;background:var(--panel);white-space:nowrap;border-bottom-color:var(--line2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel)}
td.muted{font-size:var(--fs-sm)}
td.price{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:500}
.cur{color:var(--mute);font-weight:400;margin-right:2px;font-size:var(--fs-xs)}
tr.isdup td{background:var(--dup-soft)}
tr.ispend td{background:var(--pend-soft)}
tr.ishid td{color:var(--mute)}
tr.ishid img{opacity:.45}
tr.gfirst td{border-top:1px solid var(--line2)}
tr.over-t td{box-shadow:inset 0 3px 0 var(--acc)}
tr.over-b td{box-shadow:inset 0 -3px 0 var(--acc)}
tr.dragging td{opacity:.4}
th.selc,td.selc{width:36px;padding-right:0}
.ordc{display:flex;align-items:center;gap:4px}
.ordc input{width:52px;padding:3px 6px;text-align:center}
.ordn{font-variant-numeric:tabular-nums;color:var(--mute)}
.thumb{padding:0;border:1px solid var(--line);background:#fff;border-radius:8px;width:56px;height:56px;display:block;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}

/* product cards (gallery + collections) */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tile:hover{border-color:var(--line2);box-shadow:0 2px 10px rgba(21,32,30,.06)}
.tile.isdup{border-color:#e9c48f}
.tile.ishid{opacity:.55}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tile.drag{opacity:.35}
.tile.over-l{box-shadow:inset 4px 0 0 var(--acc)}
.tile.over-r{box-shadow:inset -4px 0 0 var(--acc)}
.tile[draggable="true"]{cursor:grab}
.tmain{background:transparent;border:0;border-radius:0;color:var(--ink);padding:0;display:flex;flex-direction:column;text-align:left;white-space:normal;width:100%;font-weight:400}
.im{width:100%;aspect-ratio:1;max-width:100%;background:#fff;display:flex;align-items:center;justify-content:center;color:#9aa6a3;font-size:var(--fs-xs);overflow:hidden;border-bottom:1px solid var(--line)}
.im img{width:100%;height:100%;object-fit:contain;pointer-events:none;padding:8px}
.tbody{padding:10px 12px 4px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tname{font-size:var(--fs-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:0;font-size:var(--fs-xs)}
.spec dt{color:var(--mute)}
.spec dd{margin:0;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 12px 10px}
.tmove{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px 10px}
.tmove span{font-size:var(--fs-xs);color:var(--mute);font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font-size:var(--fs-md);padding:28px 8px;text-align:center}

/* saved files + accounts */
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow>div:first-child{min-width:0;flex:1}
.fname{font-weight:600;overflow-wrap:anywhere}
.fmeta{font-size:var(--fs-sm);color:var(--mute);margin-top:2px}
.fmeta b{color:var(--dup);font-weight:500}

/* collections */
.cwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.cwrap{grid-template-columns:1fr}}
.clist{display:flex;flex-direction:column;gap:6px}
@media (max-width:760px){.clist{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.citem{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:normal;min-width:160px}
.citem .cname{font-weight:600;font-size:var(--fs-md);overflow-wrap:anywhere}
.citem .cmeta{font-size:var(--fs-xs);color:var(--mute);font-weight:400}
.citem[aria-current="true"]{border-color:var(--acc);background:var(--acc-soft)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chead h2{font-size:22px;letter-spacing:-.01em}
.cmeta2{font-size:var(--fs-sm);color:var(--mute);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--panel);border-radius:10px;padding:10px 12px}
.stat .v{font-size:var(--fs-lg);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ccards .im{aspect-ratio:4/3}
.vlist{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:var(--fs-sm);cursor:pointer}
.vrow:hover{background:var(--panel)}
.vrow.off{color:var(--mute)}
.vrow .vp{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.vrow.off .vp{font-weight:400;text-decoration:line-through;text-decoration-color:var(--line2)}
.vrow small{display:block;color:var(--mute);font-size:11px}
.renm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.renm input{font-size:var(--fs-lg);font-weight:600;width:280px}

/* dialog + toast */
.ov{position:fixed;inset:0;background:rgba(21,32,30,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.dlg{background:var(--bg);border-radius:14px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:20px 22px;box-shadow:0 20px 50px rgba(21,32,30,.25)}
.pics{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.pics figure{margin:0;flex:1 1 200px;text-align:center;min-width:0}
.pics img{width:100%;max-height:300px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px}
figcaption{font-size:var(--fs-xs);color:var(--mute);margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);font-size:var(--fs-md);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 8px 28px rgba(21,32,30,.3)}
.toast button{border-color:rgba(255,255,255,.7);background:transparent;color:#fff;padding:2px 12px}
@media (prefers-reduced-motion:no-preference){.tile,button,.citem{transition:border-color .15s,background-color .15s,box-shadow .15s}}
</style>

<main>
  <header class="top">
    <div>
      <h1 data-i18n="h1"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="topr">
      <div class="seg" role="group" aria-label="语言 / Language"><button type="button" id="lzh" aria-pressed="true">中文</button><button type="button" id="len" aria-pressed="false">EN</button></div>
      <div class="who" id="who"></div>
    </div>
  </header>

  <section class="notice" id="gate" hidden></section>

  <section class="login" id="login" hidden>
    <div class="entry" role="group" aria-label="语言 / Language">
      <button type="button" class="door" id="ezh" aria-pressed="true"><b>中文版</b><span>用中文界面登录</span></button>
      <button type="button" class="door" id="een" aria-pressed="false"><b>English</b><span>Sign in with the English interface</span></button>
    </div>
    <h2 data-i18n="loginH"></h2>
    <form id="lform" novalidate>
      <div class="ltabs" role="tablist"><button type="button" id="tabIn" role="tab" aria-selected="true" data-i18n="tabIn"></button><button type="button" id="tabUp" role="tab" aria-selected="false" data-i18n="tabUp"></button></div>
      <label class="field" for="lu"><span class="lbl" data-i18n="lu"></span><input type="text" id="lu" autocomplete="username" maxlength="20" data-i18n-ph="luPh"></label>
      <label class="field" for="lp"><span class="lbl" data-i18n="lp"></span><input type="password" id="lp" autocomplete="current-password" data-i18n-ph="lpPh"></label>
      <label class="field" for="lp2" id="lp2w" hidden><span class="lbl" data-i18n="lp2"></span><input type="password" id="lp2" autocomplete="new-password"></label>
      <button type="submit" id="lbtn"></button>
      <p class="prog err" id="lerr" hidden></p>
    </form>
    <p class="hint" data-i18n="loginHint"></p>
  </section>

  <div class="stack" id="app" hidden>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tSheet" aria-selected="true"><span data-i18n="tabSheet"></span></button>
      <button type="button" role="tab" id="tCombo" aria-selected="false"><span data-i18n="tabCombo"></span><span class="tcount" id="tComboN"></span></button>
    </nav>

    <div class="stack" id="pSheet">
      <section id="upSec">
        <div class="drop" id="drop" tabindex="0" role="button" data-i18n="drop"></div>
        <input type="file" id="xf" accept=".xlsx" multiple hidden>
        <p class="hint" id="upHint"></p>
        <p class="prog err" id="err" hidden></p>
      </section>

      var other=['battery','watt','rmb','usd'].some(function(k){return fmt(o[k]).trim()!==''});
      if(!other||!last)continue;
      o.model=last.model;
    }
    last=o;list.push(o);
  }
  var runs=[];
  list.forEach(function(o){
    var cur=runs[runs.length-1];
    if(cur&&cur.key===o.model){cur.rows.push(o);cur.hi=o._r}
    else runs.push({key:o.model,rows:[o],lo:o._r,hi:o._r,imgs:[]});
  });
  var placed=0;
  (f.imgs||[]).forEach(function(im){
    if(im.row<f.hr)return;
    var best=null,bd=1e9;
    runs.forEach(function(R){
      var d=im.row<R.lo?R.lo-im.row:(im.row>R.hi?im.row-R.hi:0);
      if(d<bd){bd=d;best=R}
    });
    if(best&&bd<=2){best.imgs.push(im);placed++}
  });
  runs.forEach(function(R){
    var o1=null,o2=null,rest=[];
    R.imgs.sort(function(x,y){return x.col-y.col||x.row-y.row}).forEach(function(x){
      var hd=heads[x.col]||'';
      if(/顶|top|cover|lid/i.test(hd)){if(!o2)o2=x}
      else if(/主|main/i.test(hd)){if(!o1)o1=x}
      else rest.push(x);
    });
    rest.forEach(function(x){if(!o1)o1=x;else if(!o2)o2=x});
    R.rows.forEach(function(o){o.i1=o1;o.i2=o2});
  });
  return {list:list,runs:runs,placed:placed};
}

function shrink(url){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,640/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
      var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      c.toBlob(function(b){res(b)},'image/jpeg',0.86);
    };
    im.onerror=function(){res(null)};im.src=url;
  });
}
async function upAsset(blob){
  for(var i=0;;i++){
    try{return await ASSETS.upload(blob,{type:'image/jpeg'})}
    catch(e){
      var c=e&&e.code;
      if((c==='store_unavailable'&&i<1)||(c==='rate_limited'&&i<3)){await sleep(1500*(i+1)+Math.random()*500);continue}
      throw e;
    }
  }
}
async function dbSet(path,data){
  try{await DB.doc(path).set(data)}
  catch(e){if(e&&e.code==='unavailable'){await sleep(800+Math.random()*800);await DB.doc(path).set(data)}else throw e}
}
function errText(e,kind){
  var c=e&&e.code;
  if(e&&e.msg)return e.msg;
  if(c==='invalid_argument'){if(CANW===null){CANW=false;setTimeout(function(){applyMode()},0)}return t('eDenied')}
  if(c==='quota_exceeded')return t('eQuota');
  if(c==='resource_exhausted'||c==='rate_limited')return t('eRate');
  if(c==='revoked')return t('eRevoked');
  var m=(e&&e.message)||String(e);
  return kind==='del'?t('eDel',{m:m}):kind==='order'?t('eOrder',{m:m}):kind==='combo'?t('eCombo',{m:m}):t('eSave',{m:m});
}
function chunkRows(rows,base){
  var enc=new TextEncoder(),lim=200000,baseSize=enc.encode(JSON.stringify(base)).length+200,out=[],cur=[],size=baseSize;
  rows.forEach(function(r){
    var s=enc.encode(JSON.stringify(r)).length+1;
    if(cur.length&&size+s>lim){out.push(cur);cur=[];size=baseSize}
    cur.push(r);size+=s;
  });
  out.push(cur);return out;
}

async function saveStaged(f){
  if(f.saving||!canSave())return;
  f.saving=true;if(f.saveBtn)f.saveBtn.disabled=true;if(f.rmBtn)f.rmBtn.disabled=true;
  var r=f.res,need=[],seen={},ids={},fail=0,written=[],uploaded=[];
  r.list.forEach(function(o){[o.i1,o.i2].forEach(function(x){if(x&&!seen[x.mid]){seen[x.mid]=1;need.push(x)}})});
  try{
    if(need.length&&ASSETS){
      for(var i=0;i<need.length;i++){
        setProg(f,t('pUp',{i:i+1,n:need.length}));
        var blob=await shrink(need[i].url);
        if(!blob){fail++;continue}
        try{var up=await upAsset(blob);ids[need[i].mid]=up.id;uploaded.push(up.id)}
        catch(e){
          if(e&&e.code==='quota_or_state')throw {msg:t('eImgQuota')};
          if(e&&(e.code==='not_granted'||e.code==='capability_disabled'))throw {msg:t('eImgPerm')};
          fail++;
        }
      }
    }
    setProg(f,t('pSave'));
    var rows=r.list.map(function(o){return [sv(o.model),sv(o.battery),sv(o.watt),sv(o.rmb),sv(o.usd),(o.i1&&ids[o.i1.mid])||null,(o.i2&&ids[o.i2.mid])||null]});
    var gid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    var base={g:gid,name:f.name,sheet:f.sheets[f.si].name,by:ME.id||null,acct:ACCT?ACCT.id:null,at:Date.now(),n:rows.length};
    var parts=chunkRows(rows,base);
    for(var p=0;p<parts.length;p++){
      var id=gid+'_'+p;
      await dbSet('uploads/'+id,Object.assign({},base,{part:p,parts:parts.length,rows:parts[p]}));
      written.push(id);
    }
    STAGED=STAGED.filter(function(x){return x!==f});
    var note=t('saved',{name:f.name});
    if(fail)note+=' '+t('imgFail',{n:fail});
    if(need.length&&!ASSETS)note+=' '+t('noImgPerm');
    toast(note);
    renderStaged();rebuild();
  }catch(e){
    for(var w=0;w<written.length;w++){try{await DB.doc('uploads/'+written[w]).delete()}catch(x){}}
    if(ASSETS)for(var u=0;u<uploaded.length;u++){try{await ASSETS.delete(uploaded[u])}catch(x){}}
    f.saving=false;
    setProg(f,errText(e),true);
    renderStaged();
  }
}

/* ---------- manual product order (shared) ---------- */
function fullOrder(){
  var seen={},out=[];
  ORD.forEach(function(k){if(KEYMAP[k]&&!seen[k]){seen[k]=1;out.push(k)}});
  ROWS.forEach(function(r){if(!seen[r.key]){seen[r.key]=1;out.push(r.key)}});
  return out;
}
function canOrder(){return LAYOUT.sort==='custom'&&canEdit()}
function moveKey(k,target,after){
  if(k===target)return;
  var o=fullOrder(),i=o.indexOf(k);if(i<0)return;
  o.splice(i,1);
  var j=o.indexOf(target);if(j<0)return;
  o.splice(after?j+1:j,0,k);
  ORD=o;saveOrder();draw();
}
function moveStep(k,dir){
  var i=CURKEYS.indexOf(k),j=i+dir;
  if(i<0||j<0||j>=CURKEYS.length)return;
  moveKey(k,CURKEYS[j],dir>0);
  refocus(k,dir>0?'dn':'up');
}
function moveTo(k,n){
  var i=CURKEYS.indexOf(k);if(i<0||!(n>=1))return;
  n=Math.min(Math.round(n),CURKEYS.length);
  if(n-1===i){draw();return}
  moveKey(k,CURKEYS[n-1],n-1>i);
  refocus(k,'pos');
}
function refocus(k,kind){
  var nodes=qa('[data-mk]');
  for(var i=0;i<nodes.length;i++){
    var e=nodes[i];
    if(e.getAttribute('data-mk')===k&&e.getAttribute('data-kind')===kind&&e.offsetParent!==null){
      if(e.disabled){var o=e.parentNode.querySelector('[data-kind]:not([disabled])');if(o)o.focus()}
      else e.focus();
      return;
    }
  }
}

function sorted(list){
  var s=LAYOUT.sort,arr=list.slice();
  function by(fn,dir){return function(a,b){var x=fn(a),y=fn(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return dir*(x-y)}}
  if(s==='custom'){var o=fullOrder(),pos={};o.forEach(function(k,i){pos[k]=i});arr.sort(function(a,b){return pos[a.key]-pos[b.key]})}
  else if(s==='model')arr.sort(function(a,b){return String(a.model).localeCompare(String(b.model),LANG==='en'?'en':'zh',{numeric:true})});
  else if(s==='usd_asc')arr.sort(by(function(r){return numAt(r.usd)},1));
  else if(s==='usd_desc')arr.sort(by(function(r){return numAt(r.usd)},-1));
  else if(s==='rmb_asc')arr.sort(by(function(r){return numAt(r.rmb)},1));
  else if(s==='rmb_desc')arr.sort(by(function(r){return numAt(r.rmb)},-1));
  else if(s==='watt_asc')arr.sort(by(function(r){return wnum(r.watt)},1));
  else if(s==='watt_desc')arr.sort(by(function(r){return wnum(r.watt)},-1));
  else if(s==='dup')arr.sort(function(a,b){return (b.dup?1:0)-(a.dup?1:0)||(a.dup&&b.dup?a.key.localeCompare(b.key):0)});
  return arr;
}

    id=newComboId();

    d.items=d.items||[];

function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return(b<16?'0':'')+b.toString(16)}).join('')}
function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function normName(n){return String(n||'').trim().replace(/\s+/g,' ').toLowerCase()}
async function acctId(name){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normName(name)));return 'a'+hex(b).slice(0,24)}
async function pwHash(pw,salt,iter){
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:iter,hash:'SHA-256'},key,256));
}

  $('lp2w').hidden=tb!=='up';$('lbtn').textContent=tb==='up'?t('btnUp'):t('btnIn');

async function submitLogin(e){
  e.preventDefault();lerr('');
  if(!DB){lerr(t('eNoDb'));return}
  if(!window.crypto||!crypto.subtle){lerr(t('eCrypto'));return}
  var name=$('lu').value.trim().replace(/\s+/g,' '),pw=$('lp').value;
  if(!name){lerr(t('eName'));return}
  if(name.length>20){lerr(t('eNameLong'));return}
  if(pw.length<6){lerr(t('ePw'));return}
  if(LTAB==='up'&&pw!==$('lp2').value){lerr(t('ePw2'));return}
  var btn=$('lbtn');btn.disabled=true;btn.textContent=LTAB==='up'?t('btnUpBusy'):t('btnInBusy');
  try{
    var id=await acctId(name),ref=DB.doc('acctpw/'+id);
    if(LTAB==='up'){
      try{var l=await ref.acquire({holder:'reg-'+Math.random().toString(36).slice(2),ttlMs:10000});if(l&&l.acquired===false)throw {msg:t('eBusyName')}}
      catch(x){if(x&&x.msg)throw x}
      var ex=await ref.get();
      if(ex.exists&&ex.data()&&ex.data().hash)throw {msg:t('eTaken')};
      var salt=hex(crypto.getRandomValues(new Uint8Array(16))),iter=150000,h=await pwHash(pw,salt,iter);
      await ref.set({salt:salt,hash:h,iter:iter});
      await DB.doc('accounts/'+id).set({name:name,at:Date.now(),cid:ME.id||null});
      signIn({id:id,name:name},h);
    }else{
      var sn=await ref.get(),d=sn.exists&&sn.data();
      if(!d||!d.hash)throw {msg:t('eBadNew')};
      var h2=await pwHash(pw,d.salt,d.iter||150000);
      if(h2!==d.hash)throw {msg:t('eBad')};
      var a=await DB.doc('accounts/'+id).get();
      signIn({id:id,name:(a.exists&&a.data()&&a.data().name)||name},h2);
    }
  }catch(x){
    if(x&&x.msg)lerr(x.msg);
    else if(x&&x.code==='invalid_argument')lerr(t('eViewReg'));
    else if(x&&(x.code==='resource_exhausted'||x.code==='unavailable'))lerr(t('eNet'));
    else lerr(t('eGeneric',{m:(x&&x.message)||x}));
  }
  btn.disabled=false;setTab(LTAB);
}

function toPng(url){

      var s=Math.min(1,300/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');

      var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      c.toBlob(function(b){if(!b)return res(null);b.arrayBuffer().then(function(buf){res({buf:buf,w:c.width,h:c.height})})},'image/png');
    };
    im.onerror=function(){res(null)};im.src=url;
  });
}

  }
  if(o.total){
    var li=cols.findIndex(function(k){return k!=='img'&&k!=='img2'});
    var tv=cols.map(function(k,ix){
      if(k==='usd')return su.length?Math.round(su.reduce(function(a,b){return a+b},0)*10)/10:'';
      if(k==='rmb')return sr.length?sr.reduce(function(a,b){return a+b},0):'';
      return ix===li?t('xTotal'):'';
    });
    var trw=ws.addRow(tv);trw.font={bold:true};
    if(ui>=0)trw.getCell(ui+1).numFmt='0.0';if(ri>=0)trw.getCell(ri+1).numFmt='0.00';
  }
  return wb.xlsx.writeBuffer();
}
function today(){var d=new Date(),p=function(n){return(n<10?'0':'')+n};return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())}
async function exportXlsx(){
  var m=$('expMsg');m.hidden=true;
  if(!DL){m.textContent=t('expLogin');m.hidden=false;return}
  var list=sorted(filtered()),btn=$('exp');
  btn.dataset.busy='1';btn.disabled=true;btn.textContent=t('expBusy');
  try{
    var buf=await buildBook({sheet:t('xSheet'),cols:visibleCols(),rows:list,dupCol:list.some(function(r){return r.dup})});
    await DL.save({filename:t('xFile',{d:today()}),data:buf});
  }catch(e){if(!(e&&e.code==='declined')){m.textContent=t('expFail',{m:(e&&e.message)||e});m.hidden=false}}
  delete btn.dataset.busy;draw();
}
async function exportCombo(id,btn){
  var d=COMBOS[id];if(!d||!DL)return;
  var rows=[];
  (d.items||[]).forEach(function(it){var inc={};(it.r||[]).forEach(function(x){inc[x]=1});rowsOfKey(it.k).forEach(function(r){if(inc[r.rid])rows.push(r)})});
  var cols=visibleCols().filter(function(k){return ['file','by','at'].indexOf(k)<0});
  var label=btn.textContent;btn.disabled=true;btn.textContent=t('expBusy');
  try{
    var sheet=String(d.name).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||t('xSheet');
    var buf=await buildBook({sheet:sheet,title:d.name,cols:cols,rows:rows,total:true});
    await DL.save({filename:String(d.name).replace(/[\\\/:*?"<>|]/g,' ').trim()+'_'+today()+'.xlsx',data:buf});
  }catch(e){if(!(e&&e.code==='declined'))toast(t('expFail',{m:(e&&e.message)||e}))}
  btn.disabled=false;btn.textContent=label;
}

(async function boot(){
  var c=window.claude;
  if(!c||typeof c.use!=='function'){loadPrefs();setMode('local');return}
  function get(n){try{return Promise.resolve(c.use(n)).catch(function(){return null})}catch(e){return Promise.resolve(null)}}
  var got=await Promise.all([get('db'),get('user'),get('assets'),get('downloads')]);
  DB=got[0];USER=got[1];ASSETS=got[2];DL=got[3];
  if(USER){
    try{ME=await USER.me()}catch(e){}
    try{CANW=await USER.can('data.write')}catch(e){}
    try{ISOWNER=await USER.isOwner()}catch(e){}
  }
  if(!DB){loadPrefs();setMode('local');return}
  await tryResume();
  MODE='shared';loadPrefs();applyMode();
  subscribe();subscribeAccounts();subscribeOrder();subscribeCombos();
})();
})();
